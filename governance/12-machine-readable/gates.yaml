schema_version: '1.0'
gates:
- id: GATE-BK-000
  kind: builderkit
  title: BuilderKit acceptance
  status: PASS
  objective: Prove the packaged BuilderKit is self-contained, internally consistent,
    semantically traceable, safe to bootstrap and free of hidden-conversation dependencies.
  rationale: The BuilderKit is project control-plane infrastructure. Partial generation
    or stale metadata would recreate known Codex failure modes before implementation
    begins.
  prerequisites: []
  environment: Clean local workspace with Python 3 and PyYAML; no GPU hardware required.
  hardware: None.
  procedure:
  - Run validate-builderkit.py
  - Run validate-traceability.py
  - Run validate-upstreams.py
  - Parse all YAML/JSON
  - Verify source-view synchronization
  - Scan placeholders/secrets/binaries/zero-byte/temp files
  - Verify ZIP integrity and SHA-256
  - Run fresh semantic consistency checks over North Star, invariants, phases and
    proof gates.
  expected_result: All fatal validation rules pass; only explicitly structured PROOF_REQUIRED
    decisions remain unresolved.
  metrics:
  - validator exit codes
  - entity counts
  - unresolved reference count
  - placeholder count
  - secret scan count
  - ZIP CRC errors
  artifacts:
  - validation-report.json
  - builderkit-manifest.json
  - SpanGPU-BuilderKit.zip
  - SpanGPU-BuilderKit.zip.sha256
  pass_rule: All fatal validators exit 0, ZIP integrity passes, manifest hashes match
    and no prohibited content/secret/proprietary binary is present.
  fail_rule: Any fatal semantic/reference/packaging/source-of-truth violation or unsafe
    script default produces FAIL and BuilderKit is not distributable.
  blocked_rule: Missing Python/PyYAML/ZIP support is BLOCKED_ENVIRONMENT; do not report
    PASS.
  next_action: Set PROJECT_STATE current_phase=PHASE-000 and current_gate=GATE-000.

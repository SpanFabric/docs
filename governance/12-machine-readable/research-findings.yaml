schema_version: '1.0'
findings:
- id: RF-001
  title: GPU-PV validates transparent Windows GPU paravirtualization
  finding: Microsoft WDDM GPU-PV keeps application graphics runtimes unchanged while
    virtualizing GPU execution.
  source: https://learn.microsoft.com/en-us/windows-hardware/drivers/display/gpu-paravirtualization
- id: RF-002
  title: GPU-PV mirrors selected state locally
  finding: Microsoft deliberately keeps some object state local to avoid expensive
    host communication; SpanGPU needs the same principle across WAN.
  source: https://learn.microsoft.com/en-us/windows-hardware/drivers/display/gpu-paravirtualization
- id: RF-003
  title: Triton provides an OSS Windows WDDM D3D11 starting point
  finding: UTM/osy Triton combines a virtio-derived WDDM KMD with a Mesa-based D3D
    UMD and is the closest open Windows client starting point found.
  source: https://blog.getutm.app/2026/introducing-triton-directx-11-driver-for-qemu/
- id: RF-004
  title: Triton is experimental and VM-local
  finding: Triton/Neptune proves important pieces but assumes VM-local virtio transport
    and cannot be treated as a WAN-ready production driver.
  source: https://github.com/osy/kvm-guest-drivers-windows/tree/neptune
- id: RF-005
  title: Neptune supplies a matching host-side D3D virtualization path
  finding: UTM Neptune/virglrenderer and DXVK-native provide a source-available host
    path for the Triton D3D11 prototype.
  source: https://blog.getutm.app/2026/introducing-neptune-direct3d-virtualization-for-qemu/
- id: RF-006
  title: virtio-gpu is a useful device/resource/fence model
  finding: virtio-gpu defines device, resource, command and fence concepts that are
    useful at the Windows boundary.
  source: https://www.qemu.org/docs/master/system/devices/virtio/virtio-gpu.html
- id: RF-007
  title: Unmodified virtio transport is WAN-hostile
  finding: Virtqueue/shared-memory/blob assumptions target VM-local latency and cannot
    be tunneled packet-for-packet over WAN.
  source: https://www.qemu.org/docs/master/system/devices/virtio/virtio-gpu.html
- id: RF-008
  title: Venus provides reusable Vulkan object and command serialization
  finding: Mesa Venus serializes Vulkan over virtio-gpu and offers strong object-lifetime/queue
    patterns.
  source: https://docs.mesa3d.org/drivers/venus.html
- id: RF-009
  title: Venus memory transport needs replacement
  finding: Venus relies on host-visible/blob/shared memory semantics unsuitable for
    remote-authoritative WAN VRAM.
  source: https://docs.mesa3d.org/drivers/venus.html
- id: RF-010
  title: gfxstream provides mature graphics command-streaming patterns
  finding: gfxstream offers API encoding/decoding, code generation and end-to-end
    test patterns useful for SpanGPU.
  source: https://github.com/google/gfxstream
- id: RF-011
  title: LUPINE proves modern open GPU-over-IP for compute
  finding: LUPINE demonstrates source-available network GPU sessions/handle remoting
    for CUDA/NVML and is valuable for session and RPC patterns.
  source: https://github.com/lupinemachines/lupine
- id: RF-012
  title: Juice is not an independent OSS core
  finding: The public Juice repository does not contain the complete graphics/GPU
    data plane required for an independent fork.
  source: https://github.com/Juice-Labs/Juice-Labs
- id: RF-013
  title: Juice Windows path uses proprietary/injection components
  finding: The public Windows launcher calls unavailable/proprietary juiceclient.dll
    and launch.exe and uses injection/ICD mechanisms, conflicting with the North Star.
  source: https://github.com/Juice-Labs/Juice-Labs
- id: RF-014
  title: MsQuic is a strong default WAN transport building block
  finding: MsQuic provides maintained cross-platform QUIC/TLS with streams and is
    appropriate as a replaceable transport dependency.
  source: https://github.com/microsoft/msquic
- id: RF-015
  title: RDMA/RoCE can be an optional controlled-network fast path
  finding: RDMA/libfabric may benefit datacenter/LAN deployment but cannot be the
    WAN correctness baseline.
  source: https://github.com/ofiwg/libfabric
- id: RF-016
  title: PCIe-over-network is a research path, not the primary WAN design
  finding: A 2026 prototype initialized a remote RTX via stock Linux NVIDIA driver,
    but did not prove Windows WDDM, DMA, gaming or WAN frame-time viability.
  source: https://leoustc.com/blog-2026-08-16-pcie-over-network/
- id: RF-017
  title: Stock vendor driver on the client is not a safe baseline assumption
  finding: NVIDIA/AMD client hardware interfaces are proprietary and vendor-controlled;
    SpanGPU must not depend on reverse-emulating them for v1.
  source: https://docs.nvidia.com/vgpu/
- id: RF-018
  title: Stock vendor drivers are feasible on the host
  finding: Host rendering can target normal NVIDIA/AMD Vulkan/OpenGL/vendor stacks
    behind a SpanGPU backend abstraction.
  source: https://docs.mesa3d.org/
- id: RF-019
  title: D3D11 is the lowest-risk first graphics proof
  finding: Existing Triton/Neptune code makes D3D11 the cheapest architecture-valid
    proof before D3D12.
  source: https://blog.getutm.app/2026/introducing-triton-directx-11-driver-for-qemu/
- id: RF-020
  title: D3D12 remains a major greenfield risk
  finding: No researched drop-in open D3D12 WDDM path meets the target; D3D12 requires
    its own proof gate.
  source: https://blog.getutm.app/2026/introducing-triton-directx-11-driver-for-qemu/
- id: RF-021
  title: OpenGL can likely consolidate through Mesa/Zink
  finding: Zink can implement desktop OpenGL over Vulkan, reducing independent host
    backend complexity where compatibility permits.
  source: https://docs.mesa3d.org/drivers/zink.html
- id: RF-022
  title: Remote VRAM must be remote-authoritative
  finding: A WAN design cannot pretend remote VRAM is synchronously shared local memory;
    explicit ownership, upload, eviction and readback semantics are required.
  source: Research 1–3 synthesis
- id: RF-023
  title: Fence virtualization is a central WAN correctness problem
  finding: Synchronous fence waits become catastrophic at 5–40 ms RTT; completions
    must be asynchronous unless application semantics require blocking.
  source: Research 1–3 synthesis
- id: RF-024
  title: Persistent content-addressed caching is essential for WAN viability
  finding: Stable resources, shaders and pipelines should be uploaded once and subsequently
    referenced by IDs/hashes.
  source: Research 1–3 synthesis
- id: RF-025
  title: Presentation is an independent architecture proof
  finding: Rendering a remote frame is insufficient; a normal Windows/DWM-compatible
    presentation path must be proven without a streaming-window hack.
  source: Research 1–3 synthesis
- id: RF-026
  title: Disconnect must degrade to controlled device loss
  finding: WAN failure must not corrupt driver state or cause a BSOD; TDR/device-removal/recovery
    semantics require explicit design and hardware testing.
  source: Research 1–3 synthesis
- id: RF-027
  title: Local and remote GPUs must coexist
  finding: SpanGPU should enumerate as an additional adapter and preserve the local
    GPU for desktop, decode and fallback where the API/application permits.
  source: Research 1–3 synthesis
- id: RF-028
  title: Anti-cheat acceptance is externally constrained
  finding: Signing, Secure Boot, attestation and vendor cooperation improve trust
    but cannot force EAC/BattlEye/Vanguard or any third party to accept the adapter.
  source: Research 1–3 synthesis
- id: RF-029
  title: Critical path should remain open or controlled
  finding: Architecture independence requires controlled forks/replaceable dependencies
    and excludes unavailable proprietary data-plane binaries.
  source: Research 1–3 synthesis
- id: RF-030
  title: Full North Star is mostly reuse plus high-risk adaptation
  finding: 'Estimated code reuse: 30–35% direct OSS, 35–40% modified/forked OSS, 25–35%
    greenfield; engineering risk is concentrated in modified/greenfield boundaries.'
  source: Research 3 engineering estimate

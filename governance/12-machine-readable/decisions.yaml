- id: TD-001
  title: Client abstraction boundary
  status: ACCEPTED
  context: SpanGPU needs an explicit project-wide decision for client abstraction
    boundary.
  researched_alternatives:
  - Research 1–3 alternatives relevant to this boundary
  - Greenfield implementation where reuse assumptions fail
  - Defer behind proof gate rather than assume capability
  evidence:
  - RF-003
  - RF-013
  - RF-017
  - RF-018
  decision: Use a normal WDDM adapter with API UMD/ICDs above a common SpanGPU session/resource
    layer; no launcher/game integration.
  consequences:
  - Implementation and review must preserve architecture invariants.
  - Failure of the linked proof may supersede this decision through a new TD; never
    silently work around it.
  risks:
  - RISK-001
  rejected_alternatives:
  - Unavailable proprietary critical path
  - Per-game/launcher-specific core integration
  - Unproven assumption treated as accepted where status is PROOF_REQUIRED/PROVISIONAL
  reversibility: Reversible by superseding TD with migration plan before dependent
    proof-gated phases proceed.
  migration_path: Stop dependent phase, preserve evidence, write superseding TD, update
    canonical sources/traceability, rerun affected gates.

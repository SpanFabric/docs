schema_version: '1.0'
selected_architecture: Hybrid WDDM/virtio-derived Windows frontend + semantic WAN
  command/resource protocol + remote host renderer/vendor backend, with remote-authoritative
  VRAM and legitimate Windows presentation proof gate.
invariants:
- id: INV-001
  title: Unmodified applications
  statement: Games and applications MUST NOT require source/binary modification to
    use the primary SpanGPU architecture.
  rationale: Preserves researched North Star, correctness, independence or evidence
    integrity.
  violation_examples:
  - A phase introduces a shortcut contradicting the statement.
  - A review marks success while this invariant is unproven or violated.
  automated_enforcement:
  - Architecture-guard metadata checks
  - Pattern/schema checks where possible
  - Fresh BREAKER review for semantic cases
  review_gate: Any violation requires STOP → architecture violation report → no workaround
    → escalation.
